[package]
name = "cuda_buffer_rs"
version = "0.1.0"
authors = ["Yuankun Zhu <yuankunz@nvidia.com>"]
edition = "2021"
license = "Apache-2.0"
description = "Rust bindings for the CUDA-backed rosidl::Buffer C ABI"
