[package]
name = "cuda_buffer_rs"
version = "0.1.0"
authors = ["Yuankun Zhu <yuankunz@nvidia.com>"]
edition = "2021"
license = "Apache-2.0"
description = "Rust bindings for the CUDA-backed rosidl::Buffer"
readme = "../README.md"
rust-version = "1.89"

[lib]
path = "src/lib.rs"

[features]
default = ["cuda-core"]
cuda-core = ["dep:cuda-core"]

[dependencies]
cuda-core = { version = "=0.3.1", optional = true }
cxx = "=1.0.202"
rosidl_buffer_rs = "0.1"
rosidl_runtime_rs = { version = "0.6", features = ["rosidl-buffer"] }

[build-dependencies]
cxx-build = "=1.0.202"

[dev-dependencies]
rclrs = { version = "0.7", features = ["serde", "rosidl-buffer"] }
# Replace this Git pin with a crates.io version once a compatible
# release includes https://github.com/ros2-rust/ros-env/pull/16.
ros-env = { version = "0.3", git = "https://github.com/yuanknv/ros-env.git", rev = "9ef2a067417fb3a8653f5644ee344d52a53682db" }
serde_json = "1"

[[test]]
name = "unit"
path = "test/unit.rs"

[[test]]
name = "message_compatibility"
path = "test/message_compatibility.rs"
required-features = ["cuda-core"]

[[example]]
name = "cuda_buffer_rs_test_runner"
path = "test/src/cuda_buffer_rs_test_runner.rs"
required-features = ["cuda-core"]
# Build the executable for launch tests, not an example test harness.
test = false

[[test]]
name = "launch"
path = "test/launch.rs"
required-features = ["cuda-core"]
